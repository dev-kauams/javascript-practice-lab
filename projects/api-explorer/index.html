<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API Explorer</title>
    <link rel="stylesheet" href="../_shared/theme.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Ir para os resultados</a>
    <header class="site-header">
      <div class="wrap">
        <a class="back-link" href="../../">Voltar ao laboratório</a>
        <h1>API Explorer</h1>
        <p>
          Busca de livros na
          <a href="https://openlibrary.org/dev/docs/api/search"
            >Open Library Search API</a
          >
          (pública, sem chave). Pratica fetch, async/await, cancelamento e tratamento de
          falhas.
        </p>
      </div>
    </header>

    <main id="main" class="wrap">
      <form id="search-form" class="panel" role="search" novalidate>
        <div class="controls">
          <div class="field">
            <label for="q">Pesquisar livros</label>
            <input
              id="q"
              name="q"
              type="search"
              autocomplete="off"
              placeholder="Título, autor ou assunto"
            />
          </div>
          <div class="field">
            <label for="sort">Ordenar por</label>
            <select id="sort" name="sort">
              <option value="relevance">Relevância</option>
              <option value="new">Mais recentes</option>
              <option value="old">Mais antigos</option>
              <option value="title">Título (nesta página)</option>
            </select>
          </div>
          <div class="field">
            <label class="check"
              ><input type="checkbox" name="covers" /> Somente com capa</label
            >
          </div>
          <div class="field"><button type="submit">Buscar</button></div>
        </div>
        <p class="muted">
          Sugestões:
          <button type="button" class="secondary" data-suggestion="javascript">
            javascript
          </button>
          <button type="button" class="secondary" data-suggestion="machado de assis">
            machado de assis
          </button>
          <button type="button" class="secondary" data-suggestion="dune">dune</button>
        </p>
      </form>

      <p id="status" class="status" role="status" hidden></p>
      <ul
        id="results"
        class="results"
        aria-label="Resultados da busca"
        aria-busy="false"
      ></ul>
      <nav id="pager" class="row pager" aria-label="Paginação" hidden>
        <button type="button" id="prev" class="secondary">Anterior</button>
        <span id="page-label"></span>
        <button type="button" id="next" class="secondary">Próxima</button>
      </nav>
      <p id="live" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
