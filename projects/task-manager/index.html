<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="../_shared/theme.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Ir para as tarefas</a>
    <header class="site-header">
      <div class="wrap">
        <a class="back-link" href="../../">Voltar ao laboratório</a>
        <h1>Task Manager</h1>
        <p>
          Tarefas e anotações com busca, filtros, ordenação e persistência em
          localStorage.
        </p>
      </div>
    </header>

    <main id="main" class="wrap">
      <p id="notice" class="status" hidden></p>
      <div class="layout">
        <section class="panel" aria-labelledby="form-title">
          <h2 id="form-title">Nova tarefa</h2>
          <form id="task-form" novalidate>
            <div class="field">
              <label for="title">Título</label>
              <input
                id="title"
                name="title"
                maxlength="80"
                autocomplete="off"
                aria-describedby="title-error"
              />
              <span class="error" id="title-error"></span>
            </div>
            <div class="field">
              <label for="notes">Anotações</label>
              <textarea
                id="notes"
                name="notes"
                rows="4"
                aria-describedby="notes-error"
              ></textarea>
              <span class="error" id="notes-error"></span>
            </div>
            <div class="field">
              <label for="dueDate">Prazo (opcional)</label>
              <input
                id="dueDate"
                name="dueDate"
                type="date"
                aria-describedby="dueDate-error"
              />
              <span class="error" id="dueDate-error"></span>
            </div>
            <div class="row">
              <button type="submit" id="submit-task">Adicionar tarefa</button>
              <button type="button" class="secondary" id="cancel-edit" hidden>
                Cancelar edição
              </button>
            </div>
          </form>
        </section>

        <section class="panel" aria-labelledby="list-title">
          <h2 id="list-title">Suas tarefas</h2>
          <p id="summary" class="muted"></p>
          <div class="toolbar">
            <div class="field">
              <label for="search">Buscar</label>
              <input
                id="search"
                type="search"
                placeholder="Título ou anotação"
                autocomplete="off"
              />
            </div>
            <div class="field">
              <label for="status-filter">Mostrar</label>
              <select id="status-filter">
                <option value="all">Todas</option>
                <option value="open">Abertas</option>
                <option value="done">Concluídas</option>
              </select>
            </div>
            <div class="field">
              <label for="sort-by">Ordenar por</label>
              <select id="sort-by">
                <option value="created">Data de criação</option>
                <option value="due">Prazo</option>
                <option value="title">Nome</option>
                <option value="status">Estado</option>
              </select>
            </div>
            <div class="field">
              <button
                type="button"
                class="secondary"
                id="sort-direction"
                aria-pressed="false"
              >
                Crescente
              </button>
            </div>
          </div>
          <ul id="task-list" aria-label="Lista de tarefas"></ul>
          <p id="empty" class="empty"></p>
          <div class="row" style="margin-top: 1rem">
            <button type="button" class="secondary" id="clear-done">
              Limpar concluídas
            </button>
          </div>
        </section>
      </div>
      <p id="live" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
